[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
smoltcp = { version = "=0.14.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "auto-icmp-echo-reply", "socket-tcp"] }

[features]
smoke-test = []

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true

